name = "HELM"

[setup]
script = "npm ci && npx playwright install chromium"

[[actions]]
name = "Dev server"
command = "npm run dev"

[[actions]]
name = "Fast agent check"
command = "npm run agent:fast"

[[actions]]
name = "Smoke E2E"
command = "npm run test:e2e:smoke"

[[actions]]
name = "Visual evidence"
command = "npm run test:e2e:visual -- --surface projects --viewports 390x844"

[[actions]]
name = "Full gate"
command = "npm run check"
