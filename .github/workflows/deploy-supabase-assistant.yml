name: Deploy Supabase Assistant Function

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4
    steps:
      - id: preflight
        name: Check deploy secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Supabase function deploy because SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, or OPENAI_API_KEY is missing."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        uses: actions/checkout@v4

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        name: Sync assistant function secrets
        run: npx supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" OPENAI_MODEL="$OPENAI_MODEL" --project-ref "$SUPABASE_PROJECT_REF" --yes

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        name: Deploy assistant-openai
        run: npx supabase functions deploy assistant-openai --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
