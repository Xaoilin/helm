name: Deploy Supabase Assistant Function

run-name: >-
  ${{ inputs.source_run_id != '' &&
      format('Deploy Supabase receipt {0} {1}', inputs.source_run_id, inputs.deploy_sha) ||
      format('Deploy Supabase {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Immutable verified commit to deploy
        required: false
        type: string
      source_run_id:
        description: Source CI run for idempotent receipt dispatch
        required: false
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: supabase-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.display_title, 'CI receipt source '))
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      HELM_DATABASE_BACKUP_SHA256: ${{ secrets.HELM_DATABASE_BACKUP_SHA256 }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_ALLOWED_ORIGINS: ${{ secrets.GOOGLE_OAUTH_ALLOWED_ORIGINS }}
    steps:
      - id: preflight
        name: Check deploy secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, and SUPABASE_DB_PASSWORD are required."
            exit 1
          fi
          if ! [[ "$HELM_DATABASE_BACKUP_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "A verified HELM_DATABASE_BACKUP_SHA256 is required before database cutover."
            exit 1
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "deploy_database=true" >> "$GITHUB_OUTPUT"
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "deploy_assistant=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_assistant=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            echo "deploy_google_calendar_oauth=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_google_calendar_oauth=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_sha || github.event.workflow_run.head_sha || 'master' }}

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' }}
        name: Install pinned deployment tooling
        run: npm ci

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Link Supabase project for database migrations
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - id: migration-history
        if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Prove historical schema equivalence
        run: npm run database:precutover

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' && steps.migration-history.outputs.missing_versions != '' }}
        name: Repair proven-equivalent migration history
        env:
          MISSING_VERSIONS: ${{ steps.migration-history.outputs.missing_versions }}
        run: |
          npx supabase migration repair \
            ${MISSING_VERSIONS//,/ } \
            --status applied \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Apply Supabase database migrations
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Verify migration history and Sabah One database contract
        run: npm run database:verify

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Deploy Sabah One Inventory MCP
        run: npx supabase functions deploy sabah-one-inventory-mcp --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Wait for Sabah One consent UI deployment
        timeout-minutes: 13
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 72); do
            deployed_version="$(
              curl --fail --silent --show-error \
                "https://xaoilin.github.io/helm/release.json?attempt=$attempt" \
                | jq -r '.version // empty' \
                || true
            )"
            if [ "$deployed_version" = "$expected_version" ]; then
              echo "Sabah One $expected_version is serving the OAuth consent route."
              exit 0
            fi
            if [ "$attempt" -lt 72 ]; then sleep 10; fi
          done
          echo "Sabah One $expected_version was not deployed before the OAuth enablement deadline."
          exit 1

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_database == 'true' }}
        name: Configure Sabah One OAuth origin after Inventory boundaries are live
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"site_url":"https://xaoilin.github.io/helm","oauth_server_enabled":true,"oauth_server_allow_dynamic_registration":true,"oauth_server_authorization_path":"/helm/oauth/consent"}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"

          oauth_config="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")"
          jq -e '
            .site_url == "https://xaoilin.github.io/helm"
            and .oauth_server_enabled == true
            and .oauth_server_allow_dynamic_registration == true
            and .oauth_server_authorization_path == "/helm/oauth/consent"
          ' <<<"$oauth_config" >/dev/null

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_assistant == 'true' }}
        name: Sync assistant function secrets
        run: npx supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" OPENAI_MODEL="$OPENAI_MODEL" --project-ref "$SUPABASE_PROJECT_REF" --yes

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_assistant == 'true' }}
        name: Deploy assistant-openai
        run: npx supabase functions deploy assistant-openai --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_google_calendar_oauth == 'true' }}
        name: Sync Google Calendar OAuth function secrets
        run: |
          if [ -n "$GOOGLE_OAUTH_ALLOWED_ORIGINS" ]; then
            npx supabase secrets set \
              GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
              GOOGLE_OAUTH_CLIENT_SECRET="$GOOGLE_OAUTH_CLIENT_SECRET" \
              GOOGLE_OAUTH_ALLOWED_ORIGINS="$GOOGLE_OAUTH_ALLOWED_ORIGINS" \
              --project-ref "$SUPABASE_PROJECT_REF" --yes
          else
            npx supabase secrets set \
              GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
              GOOGLE_OAUTH_CLIENT_SECRET="$GOOGLE_OAUTH_CLIENT_SECRET" \
              --project-ref "$SUPABASE_PROJECT_REF" --yes
          fi

      - if: ${{ steps.preflight.outputs.should_deploy == 'true' && steps.preflight.outputs.deploy_google_calendar_oauth == 'true' }}
        name: Deploy google-calendar-oauth
        run: npx supabase functions deploy google-calendar-oauth --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes
