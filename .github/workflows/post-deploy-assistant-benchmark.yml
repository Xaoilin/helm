name: Post-Deploy Assistant Benchmark

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Exact protected commit deployed by the calling workflow
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ASSISTANT_BENCHMARK_SECRET: ${{ secrets.ASSISTANT_BENCHMARK_SECRET }}
      ASSISTANT_DEPLOY_SHA: ${{ inputs.deploy_sha }}
    steps:
      - name: Require benchmark identity and immutable candidate
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ ${#ASSISTANT_BENCHMARK_SECRET} -lt 32 ]; then
            echo "Hosted benchmark credentials are missing; deployment is not accepted."
            exit 1
          fi
          if ! [[ "$ASSISTANT_DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "An exact deployed SHA is required."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: Verify benchmark source identity
        run: test "$(git rev-parse HEAD)" = "$ASSISTANT_DEPLOY_SHA"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prove live user and public access boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx tsx scripts/verify-hosted-assistant-access.ts

      - name: Run hosted assistant benchmark gate
        env:
          VITE_HOSTED_ASSISTANT_FUNCTION: assistant-openai
          VITE_HOSTED_ASSISTANT_MODEL: gpt-5.4
        run: npm run benchmark:assistant -- --provider hosted --enforce --output test-results/assistant-benchmark-post-deploy.json

      - name: Retain enforced result, including failed thresholds
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: assistant-benchmark-${{ inputs.deploy_sha }}
          path: |
            test-results/assistant-benchmark-post-deploy.json
            test-results/assistant-access-post-deploy.json
          if-no-files-found: warn
          retention-days: 14
