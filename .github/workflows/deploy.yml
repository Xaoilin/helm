name: Deploy to GitHub Pages

run-name: >-
  ${{ inputs.source_run_id != '' &&
      format('Deploy Pages receipt {0} {1}', inputs.source_run_id, inputs.deploy_sha) ||
      format('Deploy Pages {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Immutable verified commit to deploy
        required: false
        type: string
      source_run_id:
        description: Source CI run for idempotent receipt dispatch
        required: false
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.display_title, 'CI receipt source '))
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_sha || github.event.workflow_run.head_sha || 'master' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wait for authoritative database cutover
        timeout-minutes: 12
        run: npm run database:wait
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_ID: ${{ secrets.VITE_ELEVENLABS_VOICE_ID }}
          VITE_DEFAULT_ASSISTANT_PROVIDER: hosted
          VITE_HOSTED_ASSISTANT_FUNCTION: assistant-openai
          VITE_HOSTED_ASSISTANT_MODEL: gpt-5.4
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.display_title, 'CI receipt source '))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
