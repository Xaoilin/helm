schema = "relay/project-config/v1"
defaultProfile = "safety-first"
retentionDays = 30
artifactRoots = ["test-results", "playwright-report"]

[security]
requireProvenNetworkIsolation = false
outputLimitBytes = 16777216
excerptLimitBytes = 4096
extraEnvironmentKeys = []

[aiProvider]
argv = ["/Users/xaoilin/.local/bin/relay-codex-provider"]
executableSha256 = "9d868ed49fb61199f5e05dce072fed1548e7803f13a7eb21796a2d61b1a67c86"
network = "declared"
timeoutSeconds = 900

[[checks]]
id = "complete"
criteria = ["continuity", "coalescing", "domain-updates", "safe-errors", "multi-client", "release"]
argv = ["node", "scripts/run-check.mjs"]
cwd = "."
inputGlobs = [
  ".github/workflows/**",
  "README.md",
  "docs/**",
  "e2e/**",
  "eslint.config.*",
  "index.html",
  "package.json",
  "package-lock.json",
  "playwright.config.*",
  "public/**",
  "scripts/**",
  "src/**",
  "src-tauri/Cargo.lock",
  "src-tauri/Cargo.toml",
  "src-tauri/build.rs",
  "src-tauri/tauri.conf.json",
  "src-tauri/capabilities/**",
  "src-tauri/icons/**",
  "src-tauri/src/**",
  "supabase/functions/**",
  "supabase/migrations/**",
  "supabase/tests/**",
  "tsconfig*.json",
  "vite.config.*",
  "vitest.config.*",
]
timeoutSeconds = 1800
acceptedExitCodes = [0]
artifactGlobs = ["test-results/check/timings.json"]
externalEvidence = false
network = "forbidden"
severity = "critical"

[[checks]]
id = "database"
criteria = ["atomic-snapshot", "release"]
argv = ["node", "scripts/test-helm-database.mjs"]
cwd = "."
inputGlobs = [
  "package.json",
  "package-lock.json",
  "scripts/test-helm-database.mjs",
  "supabase/config.toml",
  "supabase/migrations/**",
  "supabase/tests/**",
]
timeoutSeconds = 1200
acceptedExitCodes = [0]
artifactGlobs = []
externalEvidence = false
network = "forbidden"
severity = "critical"

[[checks]]
id = "handoff"
criteria = ["release"]
argv = ["node", "scripts/verify-handoff.mjs"]
cwd = "."
inputGlobs = [
  ".github/workflows/**",
  "package.json",
  "package-lock.json",
  "public/release.json",
  "scripts/verify-handoff.mjs",
  "src-tauri/Cargo.lock",
  "src-tauri/Cargo.toml",
  "src-tauri/tauri.conf.json",
  "supabase/config.toml",
  "supabase/functions/**",
  "supabase/migrations/**",
]
timeoutSeconds = 600
acceptedExitCodes = [0]
artifactGlobs = []
externalEvidence = true
network = "declared"
severity = "critical"
